# Luchtmeter S3 v2 - ESPHome firmware for Home Assistant (first version, NOT yet tested on hardware)
# Screen: Waveshare 4.3in Capacitive Touch LCD (800x480 RGB565 + GT911). Sensors: SCD41, SHT45, LTR-303. NFC: ST25DV04K.
# Battery: wakes every 5 min (or on the WEKKEN button / an NFC tap), measures, sends to Home Assistant, sleeps again.

substitutions:
  name: luchtmeter
  sleep_time: 5min
  awake_time: 45s

esphome:
  name: ${name}
  friendly_name: Luchtmeter
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: 900
    then:
      - switch.turn_on: sensor_power           # 3V3_SW: sensors + NFC
      - switch.turn_on: screen_power           # 5 V boost for the screen
  on_shutdown:
    - light.turn_off: backlight
    - switch.turn_off: screen_power
    - switch.turn_off: sensor_power

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

wifi:                                          # WROOM-1U + external antenna at the top of the case
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

api:
ota:
  - platform: esphome
logger:

# ---------------------------------------------------------------- power + sleep
switch:
  - platform: gpio
    id: sensor_power
    pin: {number: GPIO15, inverted: true}      # PWR_EN low = 3V3_SW on
    restore_mode: ALWAYS_ON
    internal: true
  - platform: gpio
    id: screen_power
    pin: GPIO17                                # DISP_ON: TPS61023 enable
    restore_mode: ALWAYS_ON
    internal: true

deep_sleep:
  id: sleeper
  run_duration: ${awake_time}
  sleep_duration: ${sleep_time}
  esp32_ext1_wakeup:                           # WEKKEN button (IO0) or a phone tapping the NFC tag (ST25DV GPO, IO16)
    pins: [GPIO0, GPIO16]
    mode: ANY_LOW

sensor:
  - platform: adc
    id: vbat
    name: "Batterij spanning"
    pin: GPIO1
    attenuation: 12db
    filters:
      - multiply: 2.0                          # 1M / 1M divider
    update_interval: 30s
  - platform: template
    name: "Batterij"
    unit_of_measurement: "%"
    device_class: battery
    lambda: |-
      return clamp((id(vbat).state - 3.3f) / (4.15f - 3.3f) * 100.0f, 0.0f, 100.0f);
    update_interval: 30s
  - platform: scd4x
    i2c_id: bus_sensors
    measurement_mode: single_shot
    co2:
      id: co2
      name: "CO2"
    update_interval: 30s
  - platform: sht4x
    i2c_id: bus_sensors
    temperature:
      id: temp
      name: "Temperatuur"
    humidity:
      id: hum
      name: "Vochtigheid"
    update_interval: 30s
  - platform: ltr_als_ps
    i2c_id: bus_sensors
    type: ALS
    ambient_light:
      id: lux
      name: "Licht"
    update_interval: 30s

i2c:
  - id: bus_sensors                            # SCD41 0x62, SHT45 0x44, LTR-303 0x29, ST25DV 0x53/0x57/0x2D
    sda: GPIO4
    scl: GPIO5
  - id: bus_touch                              # GT911 0x5D
    sda: GPIO7
    scl: GPIO8

# ---------------------------------------------------------------- screen + touch
output:
  - platform: ledc
    id: bl_pwm
    pin: GPIO2                                 # PWM pin of the screen (backlight boost)

light:
  - platform: monochromatic
    id: backlight
    name: "Scherm helderheid"
    output: bl_pwm
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Inter@700"
    id: big
    size: 140
  - file: "gfonts://Inter@500"
    id: mid
    size: 40
  - file: "gfonts://Inter@400"
    id: small
    size: 26

color:
  - {id: groen, hex: "2ecc71"}
  - {id: oranje, hex: "f39c12"}
  - {id: rood, hex: "e74c3c"}
  - {id: grijs, hex: "9aa0a6"}

display:
  - platform: rpi_dpi_rgb                      # 16-bit RGB565 on the ESP32-S3 LCD peripheral
    id: scherm
    dimensions: {width: 800, height: 480}
    color_order: RGB
    pclk_frequency: 16MHz
    de_pin: GPIO10
    pclk_pin: GPIO9
    hsync_pin: GPIO11
    vsync_pin: GPIO12
    hsync_pulse_width: 4
    hsync_back_porch: 8
    hsync_front_porch: 8
    vsync_pulse_width: 4
    vsync_back_porch: 8
    vsync_front_porch: 8
    data_pins:
      red: [GPIO41, GPIO42, GPIO44, GPIO43, GPIO18]
      green: [GPIO45, GPIO46, GPIO3, GPIO38, GPIO39, GPIO40]
      blue: [GPIO13, GPIO14, GPIO21, GPIO47, GPIO48]
    update_interval: 5s
    lambda: |-
      float c = id(co2).has_state() ? id(co2).state : 0;
      Color kl = c < 800 ? id(groen) : (c < 1200 ? id(oranje) : id(rood));
      it.fill(Color::BLACK);
      it.print(400, 40, id(mid), id(grijs), TextAlign::TOP_CENTER, "CO2  ppm");
      it.printf(400, 200, id(big), kl, TextAlign::CENTER, "%.0f", c);
      it.printf(130, 380, id(mid), Color::WHITE, TextAlign::CENTER, "%.1f °C", id(temp).state);
      it.printf(400, 380, id(mid), Color::WHITE, TextAlign::CENTER, "%.0f %%", id(hum).state);
      it.printf(670, 380, id(mid), Color::WHITE, TextAlign::CENTER, "%.0f lux", id(lux).state);
      it.printf(780, 450, id(small), id(grijs), TextAlign::BOTTOM_RIGHT, "%.2f V", id(vbat).state);

touchscreen:
  - platform: gt911
    i2c_id: bus_touch
    interrupt_pin: GPIO6
    on_touch:
      - deep_sleep.prevent: sleeper            # touching keeps it awake for 30 s
      - delay: 30s
      - deep_sleep.allow: sleeper
